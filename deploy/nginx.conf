# Proxy da porta 80 -> MisterClip (8490), para a URL curta http://misterclip.nord (apelido na Meshnet).
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 100m;                 # envio de músicas (até 80 MB)

    location / {
        proxy_pass http://127.0.0.1:8490;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;                   # vídeo/áudio em streaming, sem copiar para disco
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
